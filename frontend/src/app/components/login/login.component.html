<div class="login-card">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    <h2 class="title">Iniciar sesión</h2>

    <label class="field">
  <span class="label">Correo</span>
  <input type="email" formControlName="email" placeholder="tu@correo.com" />
    </label>

    <label class="field">
      <span class="label">Contraseña</span>
      <input type="password" formControlName="password" placeholder="mínimo 6 caracteres" />
    </label>

    <div class="actions">
      <button type="submit" class="btn primary" [disabled]="loginForm.invalid">Entrar</button>
      <button type="button" class="btn ghost" (click)="loginForm.reset()">Limpiar</button>
    </div>

    <p class="hint">¿No tienes cuenta? Contacta al administrador.</p>
  </form>
</div>
